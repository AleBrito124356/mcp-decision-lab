[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-decision-lab"
version = "0.1.0"
description = "MCP server for structured decision-making — weighted decision matrices, criteria scoring, sensitivity analysis and a defensible recommendation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alejandro Brito", email = "alejandrobritoolivera@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "claude", "ai-agents", "decision-making", "reasoning", "decision-matrix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # 1.x (FastMCP) and 2.x (MCPServer) are both supported; see server.py.
    # 1.5 is the oldest release whose stdio transport passes the test suite.
    "mcp>=1.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AleBrito124356/mcp-decision-lab"
Source = "https://github.com/AleBrito124356/mcp-decision-lab"
Issues = "https://github.com/AleBrito124356/mcp-decision-lab/issues"

[project.scripts]
mcp-decision-lab = "mcp_decision_lab.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_decision_lab"]
